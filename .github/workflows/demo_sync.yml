name: Sync & Demo Pipeline (Parse & Auto-Delete)
on:
  workflow_dispatch:
    inputs:
      demo_limit:
        description: "Numero massimo di demo da scaricare in questo run"
        required: false
        default: "5"
      min_interval:
        description: "Secondi minimi di attesa tra due download demo"
        required: false
        default: "12"
      reprocess_local:
        description: "Ricalcola tutte le partite salvate dai raw_json (true/false)"
        required: false
        default: "false"
  schedule:
    - cron: "0 */6 * * *"
  push:
    paths:
      - "demos/**"

permissions:
  contents: write

concurrency:
  group: projectcs-demo-sync
  cancel-in-progress: false

jobs:
  sync_and_parse_demos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore cached SQLite state
        uses: actions/cache/restore@v4
        with:
          path: data/projectcs.sqlite
          key: projectcs-sqlite-${{ github.run_id }}
          restore-keys: |
            projectcs-sqlite-
      - name: Install dependencies and CS2 demo parser
        run: |
          python -m pip install -r requirements.txt
          python -m pip install demoparser2==0.42.2 zstandard==0.23.0
      - name: Run incremental FACEIT sync and rate-limited demo pipeline
        id: pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
          FACEIT_DOWNLOAD_API_KEY: ${{ secrets.FACEIT_DOWNLOAD_API_KEY }}
          LEETIFY_API_KEY: ${{ secrets.LEETIFY_API_KEY }}
        run: |
          set +e
          sync_rc=0
          demo_rc=0
          if [ "${{ github.event.inputs.reprocess_local || 'false' }}" = "true" ]; then
            python -m projectcs.sync --reprocess-local --export-snapshot
            sync_rc=$?
          elif [ -n "$FACEIT_API_KEY" ] || [ -n "$LEETIFY_API_KEY" ]; then
            python -m projectcs.sync --since 2026-08-20 --export-snapshot
            sync_rc=$?
          else
            echo "FACEIT_API_KEY and LEETIFY_API_KEY not configured; skipping incremental sync."
          fi

          has_local_demos=false
          if [ -d demos ] && find demos -maxdepth 1 -type f \( -name "*.dem" -o -name "*.dem.gz" -o -name "*.dem.zst" -o -name "*.json" \) | grep -q .; then
            has_local_demos=true
          fi

          demo_args=()
          if [ "$has_local_demos" = "true" ]; then
            demo_args+=(--ingest-local)
          fi
          if [ -n "$FACEIT_DOWNLOAD_API_KEY" ] && { [ -n "$DATABASE_URL" ] || [ -f data/projectcs.sqlite ]; }; then
            demo_args+=(--download-missing --limit "${{ github.event.inputs.demo_limit || '5' }}" --min-interval "${{ github.event.inputs.min_interval || '12' }}")
          elif [ -z "$FACEIT_DOWNLOAD_API_KEY" ]; then
            echo "FACEIT_DOWNLOAD_API_KEY not configured; skipping automatic demo downloads."
          fi

          if [ ${#demo_args[@]} -gt 0 ]; then
            if [ -n "$DATABASE_URL" ] || [ -f data/projectcs.sqlite ]; then
              demo_args+=(--export-snapshot)
            fi
            python -m projectcs.demos "${demo_args[@]}"
            demo_rc=$?
          fi

          has_db=false
          if [ -f data/projectcs.sqlite ]; then
            has_db=true
          fi
          echo "sync_rc=$sync_rc" >> "$GITHUB_OUTPUT"
          echo "demo_rc=$demo_rc" >> "$GITHUB_OUTPUT"
          echo "has_db=$has_db" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Save cached SQLite state
        if: always() && steps.pipeline.outputs.has_db == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/projectcs.sqlite
          key: projectcs-sqlite-${{ github.run_id }}
      - name: Commit updated published snapshots and remove processed demos
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add published/
          if [ -d demos ]; then
            git add -u demos/ || true
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: update published snapshots and auto-clean processed demos"
            git push
          fi
      - name: Check pipeline exit status
        if: always()
        run: |
          if [ "${{ steps.pipeline.outputs.sync_rc }}" != "0" ] || [ "${{ steps.pipeline.outputs.demo_rc }}" != "0" ]; then
            echo "Pipeline completed with partial errors (sync_rc=${{ steps.pipeline.outputs.sync_rc }}, demo_rc=${{ steps.pipeline.outputs.demo_rc }}). Validated snapshots were preserved and committed."
            exit 1
          fi

